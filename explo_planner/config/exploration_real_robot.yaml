# =======================================================================
# explo_planner — REAL ROBOT OVERLAY (Bunker Mini + CURT Mini)
# =======================================================================
# This is an OVERLAY, not a standalone param set. Both launch files take a
# params_file argument that layers it on top of shared_params.yaml.
#
#   CFG=$(ros2 pkg prefix explo_planner)/share/explo_planner/config
#
#   # --- TWO ROBOTS -------------------------------------------------
#   # The per-robot blocks at the bottom supply each platform's frames.
#   ros2 launch explo_planner multi_robot_exploration.launch.py \
#        robots:=bunker,curt \
#        params_file:=$CFG/exploration_real_robot.yaml
#
#   # --- ONE ROBOT --------------------------------------------------
#   # exploration_experiment.launch.py has NO namespace, so its node is
#   # /explo_planner and the per-robot blocks below do NOT match it. Its
#   # per-node dict also wins over this file for map_frame/base_frame, so
#   # PASS THE FRAME AS A LAUNCH ARG — the `/**` block below still applies
#   # everything else (the no-progress watchdog above all).
#   ros2 launch explo_planner exploration_experiment.launch.py \
#        robot:=curt base_frame:=base_link_curt \
#        params_file:=$CFG/exploration_real_robot.yaml
#   #    ... or robot:=bunker base_frame:=base_link
#
# It carries ONLY the keys where hardware differs from shared_params.yaml,
# plus the per-robot frames. Everything else is inherited, so there is one
# place to change a shared value and no silent drift between the two files.
#
# -----------------------------------------------------------------------
# MEASURED MOTION — the basis for every timeout below
# -----------------------------------------------------------------------
# Derived from the two 2026-07-31 bags with scripts/measure_bag_motion.py
# (repo root), not guessed. Bunker needed --only-3d to read past its doubled
# odom->base_link edge; see the TF WARNING below. docs/real_robot_tuning.md
# walks through how each figure became a value here.
#
#                         BUNKER (tracked)   CURT (wheeled)
#   mean speed              0.223 m/s          0.203 m/s
#   p90 / p99 speed         0.510 / 0.816      0.603 / 1.459 m/s
#   max speed               1.99 m/s           2.26 m/s
#   yaw rate p90            0.241 rad/s        0.261 rad/s
#   -> 180 deg turn         13.0 s             12.0 s
#   stationary fraction     18 %               49 %
#   longest standstill      1.9 s              22.6 s
#   min travel / 30 s win   1.33 m             0.51 m
#   min net / 120 s win     3.23 m             2.33 m
#
# CURT is the binding constraint on every timeout: it is stationary half
# the time and stands still for up to 22.6 s at a stretch.
#
# BOTH PLATFORMS ARE SKID-STEER AND CANNOT STRAFE. They stop and rotate to
# face a goal, and an in-place rotation translates 0 m. Every
# distance-over-time watchdog must therefore tolerate at least one full
# 180 deg turn (~13 s) of zero translation on a perfectly healthy robot.
#
# -----------------------------------------------------------------------
# !!! TF BLOCKER — FIX BEFORE ANY HARDWARE RUN !!!
# -----------------------------------------------------------------------
# The bunker recording carries TWO publishers on odom->base_link:
#   - 10 Hz, 3D (roll/pitch present, z=-0.124)   <- coherent, used above
#   - 50 Hz, planar (z=0.0 exactly, yaw-only)    <- freezes for up to 54.7 s
# They interleave and disagree by ~6.4 m; 8545 of 25642 samples jump >1 m.
# tf2 cannot arbitrate two publishers on one edge — lookups oscillate
# between contradictory poses, and max_pose_jump_m will silently swallow
# the resulting deltas as "teleports", freezing cumulative_distance_.
#
# Neither publisher is in this stack, so the fix is on the platform, not in
# this repo. The sanctioned owner of odom->base_link is the robot_localization
# EKF (hmr_localisation/config/ekf_odom_bunker.yaml: frequency 50.0,
# two_d_mode false, publish_tf true); the NDT localiser runs Mode B and
# publishes map->odom ONLY. The planar 50 Hz stream is the base driver's own
# wheel/track odometry broadcast — turn it off there (AgileX exposes it as
# pub_odom_tf / publish_odom_tf) and keep the 3D one, because a tracked robot
# on terrain needs exactly the roll/pitch/z the planar publisher discards.
# Verify before every run — one broadcaster on the edge, or do not start:
#   ros2 run tf2_ros tf2_monitor odom base_link
# On a recording instead: scripts/measure_bag_motion.py <bag> base_link
# WITHOUT --only-3d, then read its EDGES section.
# The same fault reappears in sim for a different reason: bunker.xacro loads
# libgazebo_ros_planar_move, which broadcasts a planar odom->base_link at
# 20 Hz, so adding the EKF on top of Gazebo doubles the edge again.
#
# SECOND TF CONSTRAINT — no two robots may publish the same TF edge. The
# localiser configs (hmr_localisation/config/gt_ouster_ndt_tree_*.yaml) BOTH
# declare global_frame_id: map + odom_frame_id: odom. That bites only on a
# hand bring-up: coop_multi_robot_localization.launch.py overrides the frames
# per robot (bunker `odom`, curt `odom_curt`), so those YAML values never
# apply on that path. The shared `map` is deliberate — both robots localise
# against the same gt_map, which is what makes one fused map meaningful and
# what map_frame: "map" in both per-robot blocks below assumes.
# The trap to watch: that launch currently wires an IDENTITY STATIC for
# odom->base (its 'noekf' baseline). Swap it for the EKF stack, as its own
# comment invites, and curt breaks — ekf_odom_curt.yaml sets odom_frame: odom
# while the launch names curt's odom `odom_curt`, so base_link_curt would hang
# off BUNKER's odom and odom_curt would have no children at all. Make the EKF
# config and the launch table agree before running the EKF two-robot.
# =======================================================================
/**:
  ros__parameters:
    # -------------------------------------------------------------------
    # No-progress watchdog — THE ONE VALUE THAT MUST NOT BE INHERITED
    # -------------------------------------------------------------------
    # shared_params.yaml ships 15.0 s / 0.2 m. That is unsafe on these two
    # platforms: CURT stands still for up to 22.6 s at a stretch on a
    # healthy run, which is LONGER than the whole 15 s window, and a 180
    # deg in-place turn adds ~13 s of zero translation on top. At the end of
    # each window the check compares the robot's NET displacement since the
    # window opened (a straight line: rocking in place, or driving out and
    # back, counts as nothing) with progress_min_distance_m. Below it,
    # failGoal("no-progress") fires and the goal gets blacklisted under a
    # failed_goal_radius_m disc for failed_goal_ttl_sec.
    #
    # 120 s: a backstop behind nav2, not the first line. nav2 is watched,
    # so a goal nav2 rejects fails in seconds (nav2_abort_limit), and
    # nav2's own progress checker (0.5 m net within 10 s) notices a wedged
    # robot long before this does and runs its recoveries. Default tree:
    # 6 recovery rounds, ~2.5-3 min, then an ABORT, and that one abort
    # fails the goal (nav2_abort_final_after_recovery). The watchdog is what
    # ends a stall nav2 does not report at all: nav2 not running or not
    # watched, or nav2 SUCCEEDED short of the planner's tolerance (every
    # keep-alive re-send then succeeds at once and the robot stays parked).
    # It checks once per window, so a stall is caught 120-240 s after it
    # starts.
    # Sized on the 2026-07-31 teleop bags (operator stops included): the
    # share of sliding windows under 0.25 m net is 9 % (CURT) / 10 %
    # (bunker) at 30 s, 6 % / 0 % at 60 s, 2 % / 0 % at 90 s and 0 % / 0 %
    # at 120 s (net min 2.33 m / 3.23 m). 0.25 m is kept, far below those
    # minima; it is also the "same spot" radius of nav2_abort_limit. On
    # the first field run, read the "Goal end [no-progress]" lines: a
    # healthy robot tripping it means the window is too short.
    progress_window_sec: 120.0
    progress_min_distance_m: 0.25

    # A 180 deg in-place turn measures 12-13 s at the p90 yaw rate. The
    # inherited 15.0 leaves ~2 s for settling before failGoal("budget-
    # rotate") blacklists a goal the robot has already reached. 25 s is
    # one full turn plus a comfortable settle.
    goal_rotate_timeout_sec: 25.0

    # Nav budget cap: 10 min. The budget is only the backstop here: nav2
    # giving up fails a goal within seconds (nav2_abort_limit) and the
    # watchdog above fails a robot that stops moving. What is left for the
    # cap is a robot that keeps moving but never arrives (nav2 replanning
    # round an obstacle with no overall limit of its own). The budget still
    # scales with path length (speed 0.20-0.22 x safety 3): a 15 m goal gets
    # ~3.5 min and only goals past ~40 m reach the cap.
    nav_max_timeout_sec: 600.0
    # Must stay ABOVE nav_max_timeout_sec: a failed hop keeps charging the
    # per-tree timer, so a smaller value gives a tree up after its first
    # failed vantage approach. 720 = one worst-case failed hop (600) + 120 s
    # to re-select and reach another angle (shared_params.yaml).
    exploit_target_timeout_sec: 720.0

    # INHERITED DELIBERATELY (do not "tighten" these for hardware):
    #   nav_safety_factor 3.0 / nav_min_timeout_sec 30.0 — CURT is
    #   stationary 49 % of the time, so wall-clock budgets must be ~2x the
    #   moving-time estimate before any safety factor. The watchdog above is
    #   what catches a wedged robot; the budget is not, and shortening it
    #   only aborts healthy slow hops.
    #   max_pose_jump_m 1.0 — UNVALIDATED. map->odom is constant in both
    #   bags (max correction 0.000 m: odometry only, no loop closure), so
    #   this pipeline has never met a real SLAM discontinuity. Watch
    #   distance_traveled across the first NDT correction in the field.

    # -------------------------------------------------------------------
    # PLANNING MAP: traversability_mapping, accumulated over the ROI
    # -------------------------------------------------------------------
    # traversability_mapping (github.com/errorcodecritical/traversability_mapping)
    # publishes /occupancy_map_local: a 20 x 20 m window at 0.1 m around the
    # robot, frame map, 0..100 traversability (0 flat, 100 hard obstacle, -1
    # unseen), the same grid nav2's global costmap is built from. The planner
    # stitches the windows into one grid over the ROI ("accumulate") and uses
    # it to keep goals out of bushes and to cost paths around them:
    #   - cells >= 50 (steep / stepped / rough, and every hard obstacle) are
    #     obstacles; frontier goals on them snap up to 2 m to the nearest
    #     good cell (inherited candidate_snap_radius_m) or are dropped;
    #   - goals never sit within 0.6 m of an obstacle (clearance zone):
    #     frontier goals, tree vantages and approach points alike. An
    #     AgileX Bunker is ~0.78 m wide: at 0.4 m its sides end at the bush
    #     edge, and on the 2026-07-31 bag half the goals picked at 0.4 m had
    #     an obstacle cell 0.4-1 m away;
    #   - path cost is the Dijkstra cost over the grid: passable rough cells
    #     cost up to ~1.5x (trav_weight 1.0, values below 50), unseen cells
    #     1.25x (as if scored 25), the clearance zone 3x, so the
    #     information-per-cost utility prefers frontiers reached over open,
    #     already-seen ground. The nav time budget uses the path's length in
    #     metres, not this cost.
    # Each robot runs its own traversability_mapping in its namespace
    # (traversability_map.launch.py namespace:=<robot>), so the per-robot
    # blocks below set /<robot>/occupancy_map_local. The un-namespaced topic
    # here is for a single-robot launch (node /explo_planner).
    # The map becomes a hard startup precondition: the planner waits in
    # WAIT_FOR_MAP (logging window counts) until the first window lands.
    # Launch only traversability_filter + traversability_map
    # (launch/traversability_map.launch.py) — the PRM/path nodes are not
    # needed and carry their own CPU/memory costs — and feed them a ~5 Hz
    # cloud on the Jetson: at 10 Hz each takes most of a desktop core
    # (docs/field_setup.md, "Traversability map").
    use_planning_map: true
    planning_map_mode: "accumulate"
    planning_map_topic: "/occupancy_map_local"
    # Accumulated over the whole ROI, so frontiers far across it are in the
    # flood. The default 0 (= candidate_max_radius + 2 m = 10 m) would make
    # every one beyond 10 m unreachable. A full flood of the ~211 k-cell grid is
    # ~20-40 ms; it runs at most once per map snapshot (1 s) or 0.25 m of motion.
    cost_grid_radius_cap_m: 500.0
    planning_map_clearance_m: 0.6
    planning_map_clearance_penalty: 3.0
    planning_map_trav_weight: 1.0
    # Unseen (-1) cells are weighted as if scored 25/100: with 0 a path through
    # unmapped scrub looked as cheap as one over mapped open ground.
    planning_map_unknown_value: 25.0
    # On the 2026-07-31 bag a parked bunker sat in a ring of 99-cells 0.4-0.8 m
    # out (most likely its own body: traversability_mapping keeps returns
    # from 0.5 m out) and the path search could not leave it — 6-7 PLANs per
    # run lost the reachability filter. 1.0 m: none did.
    planning_map_robot_clear_m: 1.0

# =======================================================================
# PER-ROBOT BLOCKS
# =======================================================================
# Keys match the fully-qualified node names produced by
# multi_robot_exploration.launch.py (namespace=<robot>, name=explo_planner).
#
# base_frame is the reason this file exists. Left unset, the node computes
# base_frame = robot_name + "/base_link" (explo_planner_node.cpp:668) —
# `bunker/base_link` and `curt/base_link`, NEITHER of which exists in these
# robots' TF trees. The lookup fails, the planner never gets a pose, and it
# sits silently without ever reaching PLAN.
# -----------------------------------------------------------------------
/bunker/explo_planner:
  ros__parameters:
    robot_name: "bunker"
    base_frame: "base_link"
    map_frame: "map"
    nav_speed_estimate_mps: 0.22     # measured mean, tracked platform
    # Used only by a hand-run `ros2 run`; both launch files compute their own
    # output_csv in the per-node dict, which is applied after this file.
    output_csv: "/tmp/exploration_bunker.csv"
    # Two-robot team membership. multi_robot_exploration.launch.py sets both
    # of these from its robots:= list (its dict wins, with the same values);
    # a hand launch (`ros2 run ... -r __ns:=/bunker`) gets them only from
    # here. Neither block matches the single-robot launch's /explo_planner
    # node, so a robot running alone keeps rendezvous inert (0), as it should.
    rendezvous_expected_peers: 1
    targets_topic: "/exploration/targets/bunker"
    # This robot's own traversability_mapping (namespace:=bunker).
    planning_map_topic: "/bunker/occupancy_map_local"

/curt/explo_planner:
  ros__parameters:
    robot_name: "curt"
    base_frame: "base_link_curt"
    map_frame: "map"                 # map_curt if the two are NOT map-fused
    nav_speed_estimate_mps: 0.20     # measured mean, wheeled platform
    output_csv: "/tmp/exploration_curt.csv"
    rendezvous_expected_peers: 1     # see bunker's block
    targets_topic: "/exploration/targets/curt"
    # This robot's own traversability_mapping (namespace:=curt
    # base_frame:=base_link_curt).
    planning_map_topic: "/curt/occupancy_map_local"

# =======================================================================
# SET BEFORE THE FIRST RUN AT A NEW SITE — these cannot be measured from
# the bags and are WRONG by default. Left as-is they fail quietly.
# =======================================================================
# 1. ROI BOX. shared_params.yaml ships a 100 x 25 m box rotated 25.75 deg
#    (roi_yaw_deg / roi_origin_x / roi_origin_y + roi_min/max_x/y in the
#    ROI frame) — the tree block of the hmr_localisation gt_map site.
#    Candidates outside the box are discarded, so a box that misses the real
#    survey area starves the planner of candidates and it reports done with
#    an unexplored site. At a new site set the seven keys to the actual
#    survey extent (roi_yaw_deg 0 + origin 0 for a plain map-frame box),
#    with roi_min_z/roi_max_z (-5.5 / 4.0, terrain-relative) spanning
#    ground-to-canopy. The node logs the ROI and its map-frame extent at
#    startup.
#
# 2. proximity_peer_pose_topics. UNSET, and the node warns at startup that
#    the proximity guard is then running on the 1 Hz intent heartbeat
#    alone. These robots close at up to 2 x 2.26 m/s in the worst measured
#    case, which is ~4.5 m of unseen approach between heartbeats against a
#    proximity_hold_dist_m of 5.0 — i.e. effectively no guard at the only
#    moment it matters. Point it at the peers' 30 Hz localiser poses
#    (pose_publish_frequency: 30.0 in gt_ouster_ndt_tree_*.yaml); it is
#    left unset here rather than guessed, because a WRONG topic name
#    produces exactly the same silent never-holds behaviour.
#    Entries are "<robot_name>:<topic>" of a PoseWithCovarianceStamped in
#    the map frame; a bare topic is skipped with a warning at startup. The
#    NDT pipeline publishes its pose as /pcl_pose — confirm the namespaced
#    name on the platform with `ros2 topic info -v`, then:
#      proximity_peer_pose_topics: ["curt:/curt/pcl_pose"]      # bunker's block
#      proximity_peer_pose_topics: ["bunker:/bunker/pcl_pose"]  # curt's block
#
# 3. rendezvous_max_wait_sec inherits 600 s (shared_params.yaml; the
#    multi_robot launch arg default matches). A robot that exhausts its
#    goals returns to the mission start point and waits there for the
#    team, giving up after the timeout and parking in DONE (still
#    beaconing its presence). Set 0 only for a controlled trial where
#    WAIT FOREVER is intended and someone is watching.
