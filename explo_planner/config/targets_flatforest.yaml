# Tree-target schedule for the hmr_sim `flatforest` world (sim exploration +
# exploitation run).
#
# Centres are real, isolated trunks from the world SDF, far enough from spawn
# for the approach march to map each ring. target_radius covers the 1.70 m root
# flare, else lineOfSightClear reads the flare as an occluder.
# (notes: targets-flatforest-trunks)
#
# Release times are in SIM seconds from the scheduler's origin, which it latches
# on its first tick with a live /clock — i.e. from when the scheduler starts,
# not from when the sim started. 120 s of plain exploration first, then one
# target every 300 s. That spacing covers the worst case for one trunk here —
# a 20-30 m traverse, the approach march that maps the ring, then three ~4 m
# vantage hops with 3 x exploit_dwell_sec — while matching
# exploit_target_timeout_sec (300 s, measured from the last progress event, not
# from activation), so a target that genuinely cannot be worked closes PARTIAL
# rather than queueing up behind the next release.
# Moved comments: doc/explo_planner_code_notes.md
target_scheduler:
  ros__parameters:
    use_sim_time: true
    targets_topic: "/exploration/targets"
    frame_id: "map"

    target_ids:         [1,      2,      3]
    target_x:           [9.96,   4.40,  -9.85]
    target_y:           [8.34,  -18.81, 11.61]
    target_z:           [0.0,    0.0,    0.0]   # flat world: ground plane at z=0
    target_radius:      [1.80,   1.80,   1.80]  # covers the root flare (see above)
    target_height:      [6.5,    6.5,    6.5]   # informational
    target_release_sec: [120.0, 420.0,  720.0]
