# Tree-target schedule for the map-test-2 bag (dscovox exploitation run).
#
# Companion to doc/dscovox_exploitation_run.md. Unlike config/targets.yaml
# (generic placeholders), these are REAL trunks measured out of the ground-truth
# map hmr_localisation/gt_map/gt_map.ply, and each release time is set so the
# target lands while the bag walk is passing that trunk.
#
# The trunks were picked for the absolute z knobs of the time. These centres and
# vantage_start_angle_deg 30 were solved together; re-check the vantages when
# changing either. (notes: targets-map-test2-trunks)
#
# Release times are in SIM seconds from the scheduler's origin, which it latches
# on its first tick with a live /clock (~bag start). The bag's first localized
# pose lands ~2.6 s after that, so these are (trajectory time + ~2.6 s), set a
# few seconds BEFORE closest approach so the planner engages on the way in.
# Moved comments: doc/explo_planner_code_notes.md
target_scheduler:
  ros__parameters:
    use_sim_time: true
    targets_topic: "/exploration/targets"
    frame_id: "map"

    target_ids:         [1,      2]
    target_x:           [5.43,  15.93]
    target_y:           [-8.10, 16.57]
    target_z:           [-1.70, -2.65]   # trunk base (local ground) in map frame
    target_radius:      [0.25,   0.27]
    target_height:      [9.0,    8.0]    # informational
    target_release_sec: [143.0, 215.0]
