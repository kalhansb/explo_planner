# SHARED PARAMETERS — the one parameter file loaded by all three launch files
# (exploration_experiment, exploitation_experiment, multi_robot_exploration)
# and by hand-run `ros2 run ... --params-file` invocations. Everything the
# planner nodes share lives here; the launch files are the source of truth for
# the per-run values they declare as arguments (robot, use_sim_time, max_steps,
# output_csv, ...) — those launch defaults are passed on top of this file and
# win over the same keys below.
#
# A bare explo_planner key matches only a node at the root namespace; /**
# matches it in any namespace, so single- and multi-robot launches both load
# this file. (notes: yaml-namespace-wildcard)
# Moved comments: doc/shared_params_notes.md
/**:
  ros__parameters:
    # False for the field. With it true and no /clock publisher the tick timer
    # never fires and the planner silently does nothing. Sim and bag runs must
    # set it true via the launch argument, which overrides this.
    # (notes: yaml-use-sim-time)
    use_sim_time: false
    robot_name: "atlas"
    # Same step budget as the campaign harness and the launch-file defaults.
    # (notes: yaml-max-steps-campaign)
    max_steps: 500
    output_csv: "/tmp/exploration_eig.csv"
    # CSV sampling period in sim seconds; 0 disables. Timer rows carry a state
    # other than LOG_STEP. Each sample re-ingests and walks the whole fused map
    # on the single-threaded executor; metrics_max_duty bounds that cost.
    # (notes: yaml-metrics-period)
    metrics_period_sec: 5.0
    # Ceiling on the fraction of wall time the sampler may use; past it the
    # sampler stretches its own period with a WARN. Measured on a steady clock,
    # not the ROS clock. (notes: yaml-metrics-max-duty)
    metrics_max_duty: 0.2

    # --- Experiment event log (newline-delimited JSON, one file per robot per
    #     run). See include/explo_planner/experiment_log.hpp for the schema and
    #     for the six concrete failures of the old CSV+log-scraping arrangement
    #     it exists to make structurally impossible.
    #
    # The CSV is unchanged; this is an additional, authoritative event stream
    # stamped on the node's own sim clock. (notes: yaml-event-log-vs-csv)
    experiment_log_enabled: true
    # Empty = derive from output_csv: <csv without .csv>.events.jsonl, i.e. the
    # event log lands beside the CSV of the same run with no harness change. Set
    # an explicit path to override. NB a FIXED path here would make every robot
    # of every arm truncate the same file — leave it empty unless you mean it.
    experiment_log_path: ""
    # clock_anchor cadence in sim seconds; 0 disables. Each anchor is a (sim,
    # wall) pair plus the real-time factor since the last, making this log the
    # sim-to-wall table for the run's other logs.
    # (notes: yaml-clock-anchor-period)
    experiment_log_anchor_period_sec: 10.0
    # Descending unknown-fraction ladder; each rung fires once, when this
    # robot's coverage first crosses it. Every rung must sit strictly above
    # done_unknown_fraction: move the ladder when that moves.
    # (notes: yaml-coverage-milestones)
    coverage_milestones: [0.90, 0.85, 0.80, 0.75, 0.70, 0.65]

    map_resolution: 0.10

    # Frames — planner reads dscovox map (in map_frame) and uses TF
    # map_frame -> base_frame for the robot pose. Goals are published in
    # map_frame for the nav stack to consume.
    map_frame: "map"
    base_frame: ""   # empty -> defaults to <robot_name>/base_link

    # Master switch for the 2D planning_map filter and path cost. Off: costs are
    # straight-line and obstacle avoidance is left to the navigator. On, it is a
    # startup precondition: point planning_map_topic at a publisher.
    # (notes: yaml-use-planning-map)
    # planning_map_topic: "/<robot>/dscovox_node/planning_map"  # default
    use_planning_map: false

    # Navigation
    #
    # Arrival gate: must stay looser than where simple_nav_3d actually parks, or
    # the planner misses the arrival and blacklists the goal it stands on. Do
    # not tighten it; the node warns below 0.3. (notes: yaml-arrival-gate)
    goal_xy_tolerance: 0.4
    goal_yaw_tolerance: 0.4
    # Minimum straight-line range to an EXPLORE candidate; 0 = off. Non-zero
    # stops the nearest-frontier ping-pong on a lidar; size it to the sensor's
    # useful standoff. Too large starves the candidate set.
    # (notes: yaml-candidate-min-goal-dist)
    candidate_min_goal_dist_m: 4.0
    # Deadline for the in-place rotation after the XY goal is reached, timed
    # from arrival. Separate from the nav_* travel budget on purpose: sharing
    # that budget failed (and blacklisted) goals the robot was already
    # standing on whenever it arrived near the end of its travel allowance.
    goal_rotate_timeout_sec: 15.0
    # Keep-alive interval (s) for re-sending an unchanged goal; a changed goal,
    # or the first after a subscriber appears, publishes at once. It recovers a
    # goal lost while the navigator was down; do not set 0.
    # (notes: yaml-goal-republish)
    goal_republish_sec: 5.0
    integrate_wait: 2.0

    # Per-NAVIGATE budget = clamp(dist / speed_est * safety, min, max), 20 s/m
    # at these values. A deliberately slow watchdog price, not a travel-time
    # estimate: do not raise speed_est to correct it. (notes: yaml-nav-budget)
    nav_speed_estimate_mps: 0.15
    nav_safety_factor: 3.0
    nav_min_timeout_sec: 30.0
    nav_max_timeout_sec: 180.0

    # No-progress watchdog (runs in parallel with the budget). If the robot
    # hasn't accumulated >= progress_min_distance_m of travel within
    # progress_window_sec, the goal fails immediately — wedged-robot case.
    progress_window_sec: 15.0
    progress_min_distance_m: 0.2

    # Teleport guard (m): a single-tick pose delta above this is a
    # discontinuity, not travel, and feeds neither distance_traveled nor the
    # no-progress watchdog. 0 disables. (notes: yaml-max-pose-jump)
    max_pose_jump_m: 1.0

    # Frozen-TF guard (s; 0 = disable): a transform older than this counts as
    # pose lost (have_pose_ = false), which parks planning until TF resumes.
    # (notes: yaml-pose-max-age)
    pose_max_age_sec: 5.0

    # Failed-goal blacklist. After a navigate timeout, the failed goal is
    # parked for failed_goal_ttl_sec; subsequent picks reject any candidate
    # within failed_goal_radius_m of an active entry. Prevents the planner
    # from re-picking the same unreachable goal when the robot is stuck.
    failed_goal_radius_m: 2.0
    # Skips an EXPLORE candidate within visited_goal_radius_m of a goal reached
    # in the last visited_goal_ttl_sec; 0 = off. Breaks frontier oscillation.
    # Keep the radius at or above frontier_cluster_radius_m.
    # (notes: yaml-visited-goal-suppression)
    visited_goal_radius_m: 6.0
    visited_goal_ttl_sec: 120.0
    # Seconds a failed goal stays blacklisted. Must exceed one nav budget
    # (nav_max_timeout_sec) or the trap reopens after one attempt; the planner
    # warns below nav_max_timeout_sec + 30. (notes: yaml-failed-goal-ttl)
    failed_goal_ttl_sec: 240.0
    # Permanent retirement after this many failures at one site (0 = off). TTL
    # expiry alone cannot close a PERMANENT terrain trap; retirement can, and
    # arriving at the site still clears it, so a genuinely reachable place is
    # never locked out by bad luck.
    failed_goal_retire_after: 3

    # Homing watchdog on remaining distance home: less than
    # return_approach_min_m of approach per return_approach_window_sec fires it.
    # The response is graduated (resend, retrace, short escape leg), never a
    # park. (notes: yaml-homing-approach-watchdog)
    return_approach_window_sec: 40.0
    return_approach_min_m: 1.0
    return_escape_max_attempts: 3
    return_escape_leg_sec: 30.0

    # DONE once the ROI unknown fraction stays below done_unknown_fraction for
    # done_min_consecutive_steps PLAN cycles; <= 0 disables it (only max_steps
    # stops the planner). 0.64 is calibrated on flatforest.
    # (notes: yaml-done-unknown-fraction)
    done_unknown_fraction: 0.64
    done_min_consecutive_steps: 3
    # planning_map (2D unknown cells), scovox (2.5D column coverage of the fused
    # map) or auto (planning_map once one arrives). They measure different
    # things: re-calibrate done_unknown_fraction on switching.
    # (notes: yaml-done-coverage-source)
    done_coverage_source: "scovox"
    # shutdown stops the node; idle keeps spinning, so targets released after
    # coverage-done still get exploited. Idle for the field: a shutdown races
    # the target scheduler's release cue. (notes: yaml-done-action)
    done_action: "idle"

    # Candidate generation
    # Polar adds n_radial*n_rings*n_yaw = 24 fallback samples around the robot
    # so the candidate set does not run dry near ROI corners.
    # (notes: yaml-polar-candidates)
    candidate_enable_polar: true
    candidate_n_radial: 8
    candidate_n_rings: 3
    candidate_min_radius: 2.0
    candidate_max_radius: 8.0
    # 1, not 4: the FOV model is full-azimuth, so yaw samples at one position
    # are the same view scored repeatedly -- see the fov_hfov note below.
    candidate_n_yaw: 1
    candidate_robot_z: 0.3
    candidate_occ_thresh: 0.7

    # Frontier-centroid clustering bin size (m). Frontier cells (free voxels
    # adjacent to unknown space) are binned into cubes of this edge length and
    # one centroid per bin is emitted as a long-range candidate. Larger ->
    # fewer, coarser frontier targets.
    frontier_cluster_radius_m: 5.0
    # Inset (m) of the frontier search band from the ROI z band, bottom and top;
    # it only narrows. At 0/0 the frontier set is the permanent FOV-wedge
    # surface and coverage termination is unreachable.
    # (notes: yaml-frontier-z-band)
    frontier_z_lo_offset_m: 5.7
    frontier_z_hi_offset_m: 2.5

    # XY ROI (map frame, m); no candidate is selected outside it. Keep in sync
    # with the dscovox planning_map size and origin in simple_nav_3d.launch.py.
    # The coverage-done measure shares this box. (notes: yaml-roi-xy)
    roi_min_x: -51.3
    roi_max_x: 100.9
    roi_min_y: -38.7
    roi_max_y:  74.5

    # Vertical ROI band (m), robot-relative under terrain_relative_z; the
    # share_roi_z bands of scovox_node and dscovox_node must be a superset. Each
    # bound must clear its ground-search window plus the re-band hysteresis.
    # (notes: yaml-roi-z-band)
    roi_min_z: -5.5
    roi_max_z:  4.0

    # ---- Terrain-relative (3D) mode ----
    # Candidates snap to local ground + candidate_z_clearance, the map z band
    # rides with the robot, and the 3D occupancy check runs; flat mode skips
    # that check. Required in the field. (notes: yaml-terrain-relative)
    terrain_relative_z: true
    candidate_z_clearance: 0.3      # candidate/vantage height above local ground
    ground_search_below_m: 4.0      # ground search window below the reference z
    ground_search_above_m: 1.0      # ... and above
    ground_stack_max_m: 0.6         # max occupied stack still treated as ground

    # Sensor model for the EIG raycast (VLP-16), not a driver config. Full
    # azimuth goes with fov_h_rays 96 and candidate_n_yaw 1. fov_max_range also
    # clamps the vantage standoff and sets the auto claim radius.
    # (notes: yaml-fov-model)
    fov_hfov: 6.28318            # 360 deg, matches the SDF exactly
    fov_vfov: 0.5236             # +-15 deg, VLP-16
    fov_min_range: 0.3
    fov_max_range: 20.0
    fov_h_rays: 96               # 3.75 deg apart, same density as the old 16/60 deg
    fov_v_rays: 16               # one ray per VLP-16 beam
    fov_occ_stop: 0.7

    # ----------------------------------------------------------------
    # Utility math + multi-robot coordination
    # ----------------------------------------------------------------
    # U(c) = info_gain(c) / (ε + path_cost(c))^γ, ε = 0.1 m; unreachable
    # candidates get U = −∞ and sort last. γ = 1.0 is the original SSMI.
    # (notes: yaml-utility-formula)

    # Distance discount γ, clamped to [0, 2]: 1.0 is the original SSMI
    # (bit-identical), 0.0 ranks on raw info_gain. A negative value would reward
    # distance. (notes: yaml-utility-cost-exponent)
    utility_cost_exponent: 0.5

    # Bounded grid Dijkstra. 0 = auto = candidate_max_radius + 2 m slack
    # (so the entire candidate disc is covered, plus a margin for diagonals).
    # ~5 k cells flooded at the auto bound -> well under 1 ms per PLAN tick;
    # set this >> map size to fall through to a full unbounded flood (~5 ms).
    cost_grid_radius_cap_m: 0.0

    # SSMI ablation: info_gain summed over poses every
    # trajectory_sample_spacing_m along the Dijkstra path. Off for the field
    # (multiplies raycast cost). exploration_experiment.launch.py always passes
    # both; its defaults win. (notes: yaml-trajectory-scoring)
    trajectory_scoring: false
    trajectory_sample_spacing_m: 1.5

    # MinPos coordination; false keeps single-robot behaviour bit-for-bit.
    # Harmless on one robot: the intent table stays empty and rendezvous is
    # inert while rendezvous_expected_peers is 0.
    # (notes: yaml-coordination-enabled)
    coordination_enabled: true

    # MinPos claim_radius is the disc reserved around each robot's selected
    # goal; ttl is how long an unrefreshed claim survives. Written out, not auto
    # (0), because auto tracks fov_max_range.
    # (notes: yaml-claim-radius-explicit)
    coord_claim_radius_m: 10.0      # Burgard 2005 ties the disc to sensor range
    coord_claim_ttl_sec: 5.0        # 5 x heartbeat; stalled peer releases ~5 s
    # Extra retention of EXPLOIT claims past their TTL, for vantage-contest
    # lookups only, so a starved executor does not drop a live engagement.
    # Barrier release and rendezvous presence stay on the raw TTL.
    # (notes: yaml-claim-grace)
    coord_claim_grace_sec: 10.0     # 2 x ttl; 0 = legacy single-TTL behaviour
    coord_intent_topic: "/exploration/intents"
    # Both empty = one shared intent bus. Set them to route intents through a
    # link emulator (e.g. sub rx/<peer>/exploration/intents); a relative topic
    # resolves under /<robot_name>/. Leave unset, not [].
    # (notes: yaml-split-intent-topics)
    coord_intent_pub_topic: ""
    #coord_intent_sub_topics: [""]
    coord_heartbeat_hz: 1.0
    # EXPLOIT claims use a separate, much smaller MinPos disc: vantages on one
    # trunk sit only ~(radius + standoff) apart, so the exploration-scale disc
    # would swallow the whole ring and veto the tree instead of splitting the
    # angles across the team. 0 = auto = vantage_visited_tol_m.
    coord_vantage_claim_radius_m: 0.0

    # Whether a DISCONNECTED vehicle is barred from cells it has never seen
    # first-hand; false lets it take them. A world property, not a treatment:
    # set it the same in every arm. (notes: yaml-global-alloc-comms-mask)
    global_alloc_comms_mask: false

    # Cell status thresholds, world-calibrated against done_unknown_fraction
    # 0.64. The library defaults assume a saturating map and on flatforest
    # promote nothing. (notes: yaml-cell-thresholds)
    cell_covered_max_unknown: 0.55
    cell_exploring_min_unknown: 0.62
    cell_covered_max_frontier_frac: 0.95

    # Reconnect master switch; false = the control arm. reconnect_mode picks the
    # manoeuvre. Inert unless coordination_enabled and rendezvous_expected_peers
    # > 0. The deprecated alias rendezvous_enabled wins if passed.
    # (notes: yaml-reconnect-enabled)
    reconnect_enabled: true
    rendezvous_expected_peers: 0      # teammates to wait for; 0 = inert
    # Terminal barrier give-up (s); 0 = wait forever. On expiry the robot
    # escalates once (hold_escalate), then finishes in DONE with
    # outcome=gave_up. Mid-run attempts use reconnect_midrun_max_wait_sec and
    # resume exploring. (notes: yaml-terminal-barrier-give-up)
    rendezvous_max_wait_sec: 0.0

    # rendezvous: the agreed (cell, t_meet, interval) appointment; pursuit:
    # chase the missing peer's trail; hybrid: pursue until the appointment is
    # due. rendezvous/hybrid need rendezvous_schedule_enable; all need
    # done_action idle. (notes: yaml-reconnect-mode)
    reconnect_mode: "hybrid"
    # Ceiling on one chase leg (s); wins over the nav_min_timeout_sec floor. <=
    # 0 disables pursuit (pursuit and hybrid then act as their fallback). The
    # sim harness overrides it: read the params echo.
    # (notes: yaml-pursuit-budget)
    pursuit_budget_max_sec: 240.0
    # Measured over-the-ground speed (m/s), used only to decide whether a chase
    # can finish inside pursuit_budget_max_sec. Do not unify with
    # nav_speed_estimate_mps, which is biased slow on purpose.
    # (notes: yaml-pursuit-speed)
    pursuit_speed_measured_mps: 0.40
    # Record age (s) past which the trail head is worthless and the chase is
    # skipped; <= 0 = no gate. Coupled to the mid-run silence clock: re-check
    # this whenever either changes. (notes: yaml-pursuit-staleness)
    pursuit_staleness_max_sec: 900.0
    # Arrival tolerance (m) for a manoeuvre destination, looser than
    # goal_xy_tolerance because its value is connectivity, not position. Field
    # default; the sim harness overrides it. (notes: yaml-reconnect-arrive-tol)
    reconnect_arrive_tol_m: 4.0
    # How far from the agreed cell a failed appointment drive may stop and still
    # count as at the meeting (m); clamped up to reconnect_arrive_tol_m. Farther
    # out the leg spends its escape attempts, then rolls to the next rung.
    # (notes: yaml-rendezvous-present-tol)
    rendezvous_present_tol_m: 10.0
    # Escape manoeuvres one appointment drive may spend before rolling to the
    # next rung; 0 disables the ladder. Deliberately separate from
    # return_escape_max_attempts. (notes: yaml-rendezvous-escape-attempts)
    rendezvous_escape_max_attempts: 3
    # Ceiling on one manoeuvre drive leg (s); <= 0 = unbounded. Manoeuvre legs
    # are exempt from nav_max_timeout_sec; this backstop keeps a leg from
    # costing more than the barrier it drives toward.
    # (notes: yaml-reconnect-nav-max)
    reconnect_nav_max_sec: 600.0
    # How long the release condition must hold continuously before a manoeuvre
    # ends; 0 = release on first read. Must exceed coord_claim_ttl_sec (the node
    # warns), so a single packet cannot satisfy it.
    # (notes: yaml-release-confirm)
    reconnect_release_confirm_sec: 6.0

    # ----------------------------------------------------------------
    # Proximity stop (coordinated yield)
    # ----------------------------------------------------------------
    # While driving, yield to a moving teammate nearby with a brake goal at the
    # own pose; the lexicographically smaller robot_name has right of way.
    # Best-effort coordination, not a certified safety stop.
    # (notes: yaml-proximity-stop)
    proximity_stop_enabled: true
    # Sized against the reaction budget: over 1 s of pose age, tick and brake
    # latency while the pair keeps closing, leaving margin above the 1.5 m panic
    # line. (notes: yaml-proximity-hold-dist)
    proximity_hold_dist_m: 5.0     # yield below this
    proximity_resume_dist_m: 6.0   # resume beyond this (hysteresis)
    # Freshness gates, asymmetric on purpose. Data older than pose_stale_sec
    # cannot START a hold (never brake on a ghost); an active hold with no
    # data for hold_release_stale_sec RELEASES (peer presumed gone/far —
    # comms got a fair chance to recover first).
    proximity_pose_stale_sec: 3.0
    proximity_hold_release_stale_sec: 10.0
    # A peer that moved less than peer_static_move_m in peer_static_sec counts
    # as parked and is not held against. Keep peer_static_sec above
    # exploit_dwell_sec (8 s) so a mid-capture dwell is waited out.
    # (notes: yaml-proximity-parked-peer)
    proximity_peer_static_sec: 10.0
    proximity_peer_static_move_m: 0.3
    # A parked peer inside this distance still holds the robot, until it moves
    # off or max_hold_sec fires. Matches the 1.5 m panic threshold.
    # (notes: yaml-proximity-parked-keep)
    proximity_parked_keep_dist_m: 1.5
    # Hold-time escape hatch (seconds; 0 = unbounded). The parked/stale
    # releases break most wait cycles on their own, but a DEAD teammate
    # parked inside parked_keep_dist_m would otherwise hold forever — after
    # this long the drive resumes anyway, loudly.
    proximity_max_hold_sec: 120.0
    # Post-escape immunity (s; 0 = disable): after the hold escape hatch fires,
    # the escaped-from peer cannot start a new hold for this long; cancelled
    # early if that peer moves. (notes: yaml-proximity-escape-grace)
    proximity_escape_grace_sec: 30.0
    # Extra peer pose sources as robot_name:topic entries (map frame); on
    # hardware point them at the peers' localiser poses. Unset = intents only,
    # and the planner warns. (notes: yaml-proximity-peer-pose-topics)
    #proximity_peer_pose_topics: [""]
    # NavigateToPose action used for the cancel. "" = auto =
    # /<robot_name>/navigate_to_pose (matches the goal_topic convention).
    proximity_nav_cancel_action: ""

    # ----------------------------------------------------------------
    # Perceptive exploitation
    # ----------------------------------------------------------------
    # A tree target switches EXPLORE to EXPLOIT: dwell exploit_dwell_sec at each
    # of n_vantages vantages round the trunk; with coordination the
    # min_vantages_required quota is team-wide. False = pure exploration.
    # (notes: yaml-exploitation)
    exploitation_enabled: false
    targets_topic: "/exploration/targets"
    n_vantages: 3                   # viewpoints per trunk (3 => 120 deg apart)
    min_vantages_required: 3        # clear-LoS dwells for a "successful" target
    vantage_standoff_m: 2.0         # standoff added to trunk radius (m), then
                                    # clamped to [fov_min_range+r, fov_max_range]
    # Angle of the first vantage around the trunk. 30 deg per field script §5:
    # the plantation rows run at 24.82 deg to map x, so a 0 deg start puts the
    # first vantage of every 120 deg ring straight down a row — the two other
    # vantages then land in the neighbouring canopy and fail LoS together.
    vantage_start_angle_deg: 30.0
    exploit_dwell_sec: 8.0          # hold time at each vantage (s)

    # A robot at its vantage starts its dwell only once every peer claiming the
    # same trunk is staged; each dwell then runs to completion. staged is a
    # RobotIntent wire field, so all robots need the same build.
    # (notes: yaml-dwell-sync-barrier)
    exploit_dwell_sync_enabled: true
    # Barrier give-up (s) from arrival at the vantage; 0 = wait until the peer
    # arrives (a driving peer's own timers or claim TTL still release it). On
    # expiry the robot warns and dwells solo. (notes: yaml-dwell-sync-max-wait)
    exploit_dwell_sync_max_wait_sec: 0.0

    # Per-target give-up (s) since the last progress event; on expiry the target
    # closes PARTIAL. Keep it above nav_max_timeout_sec, or every tree closes
    # PARTIAL after its first failed approach.
    # (notes: yaml-exploit-target-timeout)
    exploit_target_timeout_sec: 300.0
    target_dedup_radius_m: 1.5      # re-reported trees within this are ignored
    vantage_visited_tol_m: 0.75     # proximity that counts a vantage "dwelled"
